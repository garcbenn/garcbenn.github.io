<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BudgetWise — Personal Finance</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#18263f;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9bc1ff;outline-offset:2px}.shell{display:flex;min-height:100vh}.sidebar{width:245px;background:#102447;color:white;padding:29px 18px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-weight:800;font-size:25px;letter-spacing:-1px;padding:4px 14px 34px}.brand span{color:#69b8ff}.nav{display:grid;gap:8px}.nav button{width:100%;border:0;background:transparent;color:#c4d3e9;text-align:left;padding:14px 16px;border-radius:11px;font-weight:600}.nav button.active,.nav button:hover{background:#25436e;color:#fff}.side-bottom{position:absolute;bottom:25px;left:24px;right:24px;color:#9eb1d0;font-size:12px;line-height:1.7}.main{flex:1;min-width:0;padding:32px clamp(20px,4vw,58px) 65px;max-width:1500px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.eyebrow{color:#64809f;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px}.top h1{font-size:30px;letter-spacing:-.9px;margin:6px 0 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #d7e1ef;background:#fff;color:#213753;border-radius:10px;padding:11px 15px;font-weight:700}.btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}.btn.danger{color:#bd3245}.btn.small{padding:7px 10px;font-size:12px}.month{border:1px solid #d7e1ef;background:#fff;padding:10px;border-radius:10px;color:#203657}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:20px}.card,.panel{background:white;border:1px solid #e4eaf2;border-radius:17px;box-shadow:0 5px 22px rgba(28,53,91,.035)}.card{padding:23px}.card .label{font-size:13px;font-weight:700;color:#6c7f98}.card .value{font-size:31px;font-weight:800;margin:11px 0;letter-spacing:-1px}.card .hint{font-size:12px;color:#8191a8}.value.blue{color:#2563eb}.value.red{color:#e05c6b}.value.green{color:#0c9a77}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.panel{padding:24px;min-width:0}.panel h2{font-size:17px;margin:0 0 8px}.muted{color:#7c8da4;font-size:13px}.chart-area{display:flex;align-items:center;justify-content:center;gap:20px;min-height:245px}.donut{width:185px;height:185px;border-radius:50%;position:relative;flex-shrink:0}.donut:after{content:'';position:absolute;inset:42px;background:#fff;border-radius:50%}.legend{display:grid;gap:9px;font-size:12px}.legend-line{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}.bar-chart{height:225px;display:flex;align-items:end;justify-content:space-around;gap:30px;padding:25px 20px 0;border-bottom:1px solid #dbe3ee}.barcol{height:100%;display:flex;align-items:end;flex-direction:column;justify-content:end;gap:7px;min-width:100px}.bar{width:80px;border-radius:9px 9px 0 0;min-height:2px}.barlabel{font-size:12px;color:#7589a2;margin-bottom:-24px;text-align:center;width:100%}.barvalue{font-size:12px;font-weight:800;text-align:center;width:100%}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.sectionhead h2{margin:0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:#8291a7;font-weight:700;padding:12px;border-bottom:1px solid #e8edf4}td{padding:14px 12px;border-bottom:1px solid #eff2f7;font-size:14px}tr:last-child td{border-bottom:0}.right{text-align:right}.tag{display:inline-block;background:#eef3fa;color:#426083;border-radius:30px;padding:5px 10px;font-size:11px;font-weight:700}.income{color:#099675;font-weight:700}.expense{color:#dd5968;font-weight:700}.toolbar{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}.field{padding:11px 12px;border:1px solid #d7e1ef;border-radius:10px;background:#fff;color:#253a58;min-width:0}.toolbar .field:first-child{flex:1}.budget-grid,.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.progress{height:10px;background:#eaf0f7;border-radius:20px;overflow:hidden;margin:16px 0 10px}.progress>div{height:100%;background:#2563eb;border-radius:20px;transition:width .2s}.progress>div.warn{background:#e9a23b}.progress>div.over{background:#dc4c61}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.alert{font-size:12px;font-weight:750;padding:7px 10px;border-radius:8px;margin-top:12px;background:#fff5e2;color:#925e00}.alert.over{background:#ffe9ec;color:#b5223c}.empty{text-align:center;color:#8493a9;padding:36px 10px}.modalback{position:fixed;inset:0;background:#10213a88;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.show{display:flex}.modal{background:white;border-radius:18px;padding:25px;width:min(480px,100%);box-shadow:0 25px 90px #0a23455e}.modal h2{margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgroup{display:grid;gap:5px;font-size:12px;font-weight:700;color:#58708c}.formgroup.wide{grid-column:1/-1}.formgroup .field{width:100%}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.note{font-size:12px;color:#7285a0;margin-top:16px}.pill{background:#edf5ff;color:#245cb4;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}@media(max-width:1000px){.twocol{grid-template-columns:1fr}.sidebar{width:200px}}@media(max-width:680px){.shell{display:block}.sidebar{height:auto;width:100%;position:static;padding:13px}.brand{padding:4px 6px 14px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.side-bottom{display:none}.main{padding:22px 14px}.top{align-items:start;flex-direction:column}.cards{grid-template-columns:1fr}.budget-grid,.goal-grid{grid-template-columns:1fr}.chart-area{flex-wrap:wrap}.card .value{font-size:27px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">Budget<span>Wise</span></div><nav class="nav" id="nav"><button data-page="dashboard" class="active">▦ &nbsp; Dashboard</button><button data-page="transactions">⇄ &nbsp; Transactions</button><button data-page="budget">▥ &nbsp; Monthly Budget</button><button data-page="goals">◎ &nbsp; Savings Goals</button></nav><div class="side-bottom">SIMULATED FINANCIAL DATA<br>Educational prototype · CS 391</div></aside><main class="main"><header class="top"><div><div class="eyebrow">Your financial overview</div><h1 id="pageTitle">Dashboard</h1></div><div class="actions"><input aria-label="Selected month" id="month" class="month" type="month" value="2026-10"><button class="btn" id="reset">Reset demo</button><button class="btn primary" id="addTop">+ Add Transaction</button></div></header><div id="content"></div></main></div><div class="modalback" id="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><form id="modalForm"><div class="formgrid" id="formFields"></div><div class="modalactions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div></div><script>
const KEY='budgetwise-demo-v2';const categories=['Housing','Groceries','Transportation','Utilities','Dining','Entertainment'];const colors=['#2764ea','#39b6ad','#f2a84d','#8a77d9','#e67d91','#647eac'];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,11);const monthOf=date=>date.slice(0,7);
function seed(){let items=[['Part-time work',4500,'income','Paycheck','2026-10-02'],['Rent',1500,'expense','Housing','2026-10-03'],['Supermarket',250,'expense','Groceries','2026-10-06'],['Weekly groceries',200,'expense','Groceries','2026-10-18'],['Gas and transit',300,'expense','Transportation','2026-10-09'],['Electric and internet',250,'expense','Utilities','2026-10-12'],['Restaurants',200,'expense','Dining','2026-10-20'],['Movies and hobbies',150,'expense','Entertainment','2026-10-23']];return {transactions:items.map((a,i)=>({id:'seed'+i,description:a[0],amount:a[1],type:a[2],category:a[3],date:a[4]})),budgets:{'2026-10':{Housing:1600,Groceries:500,Transportation:400,Utilities:300,Dining:250,Entertainment:200}},goals:[{id:'goal1',name:'Emergency Fund',target:5000,saved:1000}]}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}let page='dashboard',month='2026-10',filter='all',query='';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const transactions=()=>data.transactions.filter(t=>monthOf(t.date)===month);const totals=()=>{let t=transactions();return {income:t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),expenses:t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)}};const spent=cat=>transactions().filter(x=>x.type==='expense'&&x.category===cat).reduce((a,x)=>a+x.amount,0);const budgets=()=>data.budgets[month]||{};
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('pageTitle').textContent=({dashboard:'Dashboard',transactions:'Transactions',budget:'Monthly Budget',goals:'Savings Goals'})[page];document.getElementById('content').innerHTML=({dashboard:dashboard,transactions:transactionsPage,budget:budgetPage,goals:goalsPage})[page]();}
function dashboard(){let {income,expenses}=totals(),arr=categories.map((c,i)=>({name:c,value:spent(c),color:colors[i]})).filter(x=>x.value>0),sum=arr.reduce((a,x)=>a+x.value,0),offset=0,stops=arr.map(x=>{let start=offset;offset+=x.value/sum*100;return `${x.color} ${start}% ${offset}%`}).join(',');let donut=sum?`conic-gradient(${stops})`:'#e9eff8';let mx=Math.max(income,expenses,1);return `<div class="cards"><div class="card"><div class="label">MONTHLY INCOME</div><div class="value blue" id="incomeTotal">${money(income)}</div><div class="hint">All recorded income</div></div><div class="card"><div class="label">MONTHLY EXPENSES</div><div class="value red" id="expenseTotal">${money(expenses)}</div><div class="hint">All recorded spending</div></div><div class="card"><div class="label">REMAINING BALANCE</div><div class="value ${income-expenses>=0?'green':'red'}" id="balanceTotal">${money(income-expenses)}</div><div class="hint">Income minus expenses</div></div></div><div class="twocol"><section class="panel"><h2>Spending Breakdown</h2><div class="muted">Expenses by category</div><div class="chart-area">${sum?`<div role="img" aria-label="Spending breakdown pie chart" class="donut" style="background:${donut}"></div><div class="legend">${arr.map(x=>`<div class="legend-line"><i class="dot" style="background:${x.color}"></i>${esc(x.name)} <strong>${money(x.value)}</strong></div>`).join('')}</div>`:'<div class="empty">No expenses recorded this month.</div>'}</div></section><section class="panel"><h2>Income vs. Expenses</h2><div class="muted">Monthly comparison</div><div class="bar-chart" role="img" aria-label="Income and expenses bar chart"><div class="barcol"><div class="barvalue">${money(income)}</div><div class="bar" style="height:${income/mx*165}px;background:#2764ea"></div><div class="barlabel">Income</div></div><div class="barcol"><div class="barvalue">${money(expenses)}</div><div class="bar" style="height:${expenses/mx*165}px;background:#e67d91"></div><div class="barlabel">Expenses</div></div></div></section></div><section class="panel"><div class="sectionhead"><h2>Recent Transactions</h2><button class="btn small" data-action="goto" data-value="transactions">View all →</button></div>${tableRows([...transactions()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),false)}</section>`}
function tableRows(arr,buttons=true){return arr.length?`<div class="tablewrap"><table><thead><tr><th>Description</th><th>Date</th><th>Category</th><th class="right">Amount</th>${buttons?'<th class="right">Actions</th>':''}</tr></thead><tbody>${arr.map(t=>`<tr><td><strong>${esc(t.description)}</strong></td><td>${esc(t.date)}</td><td><span class="tag">${esc(t.category)}</span></td><td class="right ${t.type}">${t.type==='income'?'+':'−'}${money(t.amount)}</td>${buttons?`<td class="right"><button class="btn small" data-action="edit" data-value="${esc(t.id)}">Edit</button> <button class="btn small danger" data-action="delete" data-value="${esc(t.id)}">Delete</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transactions found for this month.</div>'}
function transactionsPage(){let arr=[...transactions()].filter(t=>(filter==='all'||t.type===filter)&&(`${t.description} ${t.category}`.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));return `<section class="panel"><div class="sectionhead"><h2>Transaction History</h2><span class="pill">${arr.length} records</span></div><div class="toolbar"><input id="search" class="field" placeholder="Search descriptions or categories..." value="${esc(query)}" aria-label="Search transactions"><select id="typeFilter" class="field" aria-label="Filter by type"><option value="all" ${filter==='all'?'selected':''}>All types</option><option value="income" ${filter==='income'?'selected':''}>Income</option><option value="expense" ${filter==='expense'?'selected':''}>Expenses</option></select></div><div id="transactionResults">${tableRows(arr)}</div></section>`}
function budgetPage(){return `<div class="sectionhead"><div class="muted">Set monthly limits and track actual spending.</div></div><div class="budget-grid">${categories.map((c,i)=>{let limit=budgets()[c]||0,used=spent(c),ratio=limit?used/limit:used?2:0,status=limit&&ratio>1?'over':limit&&ratio>=.8?'warn':'';return `<section class="panel"><div class="between"><h2>${c}</h2><button class="btn small" data-action="budget" data-value="${c}">Edit limit</button></div><div class="between"><strong>${money(used)} spent</strong><span class="muted">of ${money(limit)}</span></div><div class="progress"><div class="${status}" style="width:${Math.min(ratio*100,100)}%;background:${status?'':colors[i]}"></div></div><div class="muted">${limit?`${money(Math.max(limit-used,0))} remaining`:'No budget set'}</div>${status?`<div class="alert ${status==='over'?'over':''}" role="status">${status==='over'?'Over budget — spending exceeds your limit':'Heads up — 80% or more of budget used'}</div>`:''}</section>`}).join('')}</div><p class="note">Budget alerts are a second-iteration enhancement. Warning at 80% or more; over-budget warning above 100%.</p>`}
function goalsPage(){return `<div class="sectionhead"><span class="muted">Track fictional savings progress independently from monthly cash flow.</span><button class="btn primary" data-action="newGoal">+ New Goal</button></div><div class="goal-grid">${data.goals.map(g=>`<section class="panel"><div class="between"><h2>${esc(g.name)}</h2><button class="btn small danger" data-action="deleteGoal" data-value="${esc(g.id)}">Delete</button></div><div class="value blue" style="font-size:27px;font-weight:800;margin:12px 0">${money(g.saved)}</div><div class="muted">of ${money(g.target)} goal</div><div class="progress"><div style="width:${Math.min(g.saved/g.target*100,100)}%"></div></div><div class="between"><span class="muted">${Math.round(g.saved/g.target*100)}% saved</span><button class="btn small" data-action="contribute" data-value="${esc(g.id)}">+ Contribute</button></div></section>`).join('')||'<div class="panel empty">No savings goals yet. Create one to get started.</div>'}</div>`}
function modal(title,fields,submit){document.getElementById('modalTitle').textContent=title;document.getElementById('formFields').innerHTML=fields;document.getElementById('modal').classList.add('show');document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);submit(f);closeModal();render()};document.querySelector('#formFields input,#formFields select')?.focus()};function closeModal(){document.getElementById('modal').classList.remove('show')}const input=(label,name,type='text',value='',wide=false,extra='')=>`<label class="formgroup ${wide?'wide':''}">${label}<input class="field" name="${name}" type="${type}" value="${esc(value)}" required ${extra}></label>`;
function transactionModal(id){let t=data.transactions.find(x=>x.id===id)||{description:'',amount:'',type:'expense',category:'Groceries',date:month+'-14'};let fields=input('Description','description','text',t.description,true,'maxlength="100"')+input('Amount ($)','amount','number',t.amount,false,'min="0.01" step="0.01"')+`<label class="formgroup">Type<select name="type" class="field" id="transactionType"><option value="expense" ${t.type==='expense'?'selected':''}>Expense</option><option value="income" ${t.type==='income'?'selected':''}>Income</option></select></label>`+`<label class="formgroup">Category<select name="category" class="field">${[...categories,'Paycheck','Other'].map(c=>`<option ${c===t.category?'selected':''}>${c}</option>`).join('')}</select></label>`+input('Date','date','date',t.date,false);modal(id?'Edit Transaction':'Add Transaction',fields,f=>{let amount=Number(f.get('amount')),date=f.get('date');if(!(amount>0)||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Enter a valid positive amount and date.');return}let next={id:id||uid(),description:String(f.get('description')).trim(),amount,type:f.get('type'),category:f.get('category'),date};if(!next.description)return;if(id)data.transactions=data.transactions.map(x=>x.id===id?next:x);else data.transactions.push(next);save()})}
function budgetModal(cat){modal('Set '+cat+' Budget',input('Monthly limit ($)','limit','number',budgets()[cat]??0,true,'min="0" step="0.01"'),f=>{data.budgets[month]??={};data.budgets[month][cat]=Math.max(0,Number(f.get('limit')));save()})}
function goalModal(){modal('Create Savings Goal',input('Goal name','name','text','',true,'maxlength="60"')+input('Target ($)','target','number','',false,'min="0.01" step="0.01"')+input('Starting amount ($)','saved','number','0',false,'min="0" step="0.01"'),f=>{let target=Number(f.get('target')),saved=Number(f.get('saved'));if(target>0&&saved>=0){data.goals.push({id:uid(),name:String(f.get('name')).trim(),target,saved});save()}})}
function contributeModal(id){modal('Add Simulated Contribution',input('Contribution ($)','amount','number','',true,'min="0.01" step="0.01"'),f=>{let goal=data.goals.find(g=>g.id===id),amount=Number(f.get('amount'));if(goal&&amount>0){goal.saved+=amount;save()}})}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};document.getElementById('month').onchange=e=>{month=e.target.value;render()};document.getElementById('addTop').onclick=()=>transactionModal();document.getElementById('reset').onclick=()=>{if(confirm('Reset all demo transactions, budgets, and savings goals?')){data=seed();save();month='2026-10';document.getElementById('month').value=month;page='dashboard';filter='all';query='';render()}};document.getElementById('cancel').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('content').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value;if(a==='goto'){page=v;render()}if(a==='edit')transactionModal(v);if(a==='delete'&&confirm('Delete this transaction?')){data.transactions=data.transactions.filter(t=>t.id!==v);save();render()}if(a==='budget')budgetModal(v);if(a==='newGoal')goalModal();if(a==='contribute')contributeModal(v);if(a==='deleteGoal'&&confirm('Delete this savings goal?')){data.goals=data.goals.filter(g=>g.id!==v);save();render()}});document.getElementById('content').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let arr=transactions().filter(t=>(filter==='all'||t.type===filter)&&(`${t.description} ${t.category}`.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('transactionResults').innerHTML=tableRows(arr)}});document.getElementById('content').addEventListener('change',e=>{if(e.target.id==='typeFilter'){filter=e.target.value;render()}});save();render();
</script></body></html>
